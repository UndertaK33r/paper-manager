<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAPER BRAIN</title>
<!-- 样式只有三份：令牌 → 主题 → 组件。
     旧版霓虹主题 p3r-tokens.css / p3r-ui.css 已停用：它的 .p3r-btn:hover
     会给按钮注入浅蓝文字，在浅色主题下不可读。 -->
<link rel="stylesheet" href="assets/kimi-tokens.css">
<link rel="stylesheet" href="assets/themes.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="k-base"></div>

<script type="text/x-template" id="app-template">
<div class="layout">
  <header class="topbar">
    <div class="brand">PAPER BRAIN</div>
    <nav class="nav">
      <button class="p3r-btn small" :class="{active: route==='list'}" @click="go('list')">论文库</button>
      <button class="p3r-btn small" :class="{active: route==='upload'}" @click="go('upload')">上传论文</button>
      <button class="p3r-btn small" :class="{active: route==='graph'}" @click="go('graph')">知识图谱</button>
      <button class="p3r-btn small" @click="openSettings">AI 设置</button>
      <button class="p3r-btn small" @click="openManage">管理</button>
    </nav>
  </header>

  <!-- ===================== 登录 ===================== -->
  <section v-if="route==='login'" class="center-page">
    <div class="p3r-dialog" style="max-width:420px">
      <div class="dialog-head"><span class="p3r-h3">登录</span></div>
      <label class="p3r-form-label">访问密码<input type="password" class="p3r-input" v-model="loginPass" @keyup.enter="doLogin"></label>
      <div v-if="loginError" class="p3r-readout p3r-readout--red">{{ loginError }}</div>
      <div class="form-actions"><button class="p3r-btn p3r-btn--primary" @click="doLogin">登录</button></div>
    </div>
  </section>

  <!-- ===================== 论文库 ===================== -->
  <section v-else-if="route==='list'">
    <div class="page-head">
      <div>
        <div class="p3r-h1">论文库</div>
        <div class="p3r-readout">共 {{ stats.total || 0 }} 篇 · 已读 {{ stats.read || 0 }} · 收藏 {{ stats.starred || 0 }}</div>
      </div>
      <div class="p3r-stat-bar page-progress"><span class="p3r-stat-bar__label">进度</span><span class="p3r-stat-bar__track"><span class="p3r-stat-bar__fill" :style="{width: readPct + '%'}"></span></span><span class="p3r-stat-bar__value">{{ readPct }}%</span></div>
    </div>

    <div class="toolbar">
      <div class="toolbar-row">
        <input class="p3r-input search" v-model="search" @input="onSearch" placeholder="搜索标题 / 作者 / DOI / 正文...">
        <div class="seg">
          <button v-for="st in statusOptions" class="p3r-btn small" :class="{active: statusFilter===st.v}" @click="setStatus(st.v)">{{ st.t }}</button>
        </div>
        <select class="p3r-input" v-model="categoryFilter" @change="applyFilters"><option value="">全部分类</option><option v-for="c in categories" :value="c.id" :key="c.id">{{ c.name }}</option></select>
        <select class="p3r-input" v-model="tagFilter" @change="applyFilters"><option value="">全部标签</option><option v-for="t in tags" :value="t.name" :key="t.id">{{ t.name }}</option></select>
        <div class="view-toggle"><button class="p3r-btn small" :class="{active: view==='table'}" @click="view='table'">表格</button><button class="p3r-btn small" :class="{active: view==='card'}" @click="view='card'">卡片</button></div>
        <button class="p3r-btn small" @click="exportBib">导出 BibTeX</button>
      </div>
    </div>

    <section class="content">
      <div v-if="loading" class="p3r-readout">LOADING...</div>
      <table v-else-if="view==='table' && papers.length" class="p3r-table">
        <thead><tr><th>NO.</th><th>标题</th><th>作者</th><th>年份</th><th>分类</th><th>标签</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          <tr v-for="(p,i) in papers" :key="p.id">
            <td class="p3r-readout">NO.{{ String(p.id).padStart(4, '0') }}</td>
            <td class="title-cell" @click="openDetail(p.id)">{{ p.title }}</td>
            <td class="ellipsis">{{ p.authors }}</td>
            <td>{{ p.year }}</td>
            <td>{{ p.categoryName }}</td>
            <td><span v-for="t in p.tags" class="p3r-badge" :key="t.id">{{ t.name }}</span></td>
            <td><span class="p3r-badge" :class="{'p3r-badge--red': p.status==='read'}">{{ statusLabel(p.status) }}</span> <span v-if="p.starred" class="p3r-badge">收藏</span></td>
            <td><div class="actions"><button class="p3r-btn small" @click="openDetail(p.id)">详情</button><button class="p3r-btn small" @click="openEdit(p)">编辑</button><button class="p3r-btn small" @click="cycleStatus(p.id)">状态</button><button class="p3r-btn small p3r-btn--danger" @click="deletePaper(p.id)">删除</button></div></td>
          </tr>
        </tbody>
      </table>
      <div v-else-if="view==='card' && papers.length" class="cards-grid">
        <div v-for="(p,i) in papers" :key="p.id" class="paper-card p3r-panel">
          <div class="p3r-readout">NO.{{ String(p.id).padStart(4, '0') }} · {{ statusLabel(p.status) }}</div>
          <div class="p3r-h3 title-cell" @click="openDetail(p.id)">{{ p.title }}</div>
          <div class="p3r-readout">{{ p.authors }} · {{ p.year }}</div>
          <div class="chips"><span v-for="t in p.tags" class="p3r-badge" :key="t.id">{{ t.name }}</span></div>
          <div class="actions"><button class="p3r-btn small" @click="openDetail(p.id)">详情</button><button class="p3r-btn small" @click="openEdit(p)">编辑</button><button class="p3r-btn small" @click="cycleStatus(p.id)">状态</button><button class="p3r-btn small p3r-btn--danger" @click="deletePaper(p.id)">删除</button></div>
        </div>
      </div>
      <div v-else class="empty"><span class="p3r-note"></span><span class="p3r-readout">暂无论文，去上传第一篇</span></div>
      <div class="pagination">
        <button class="p3r-btn small" :disabled="page<=1" @click="goPage(page-1)">上一页</button>
        <span class="p3r-cue"></span><span class="p3r-readout">第 {{ page }} / {{ pages }} 页 · 共 {{ total }} 篇</span>
        <button class="p3r-btn small" :disabled="page>=pages" @click="goPage(page+1)">下一页</button>
      </div>
    </section>
  </section>

  <!-- ===================== 详情 ===================== -->
  <section v-else-if="route==='detail'" class="detail-page">
    <div v-if="!detail.id" class="p3r-readout">LOADING...</div>
    <template v-else>
      <div class="detail-head">
        <button class="p3r-btn small" @click="go('list')">返回</button>
        <div class="detail-title">{{ detail.title }}</div>
        <div class="p3r-readout">NO.{{ String(detail.id).padStart(4, '0') }}</div>
      </div>
      <div class="detail-grid">
        <div class="p3r-panel">
          <span class="p3r-readout">基本信息</span>
          <div class="grid2">
            <label>标题<input class="p3r-input" v-model="detail.title"></label>
            <label>作者<input class="p3r-input" v-model="detail.authors"></label>
            <label>年份<input class="p3r-input" v-model="detail.year" type="number"></label>
            <label>期刊/会议<input class="p3r-input" v-model="detail.venue"></label>
            <label>DOI<input class="p3r-input" v-model="detail.doi"></label>
            <label>关键词<input class="p3r-input" v-model="detail.keywords"></label>
            <label>链接<input class="p3r-input" v-model="detail.link"></label>
            <label>分类<select class="p3r-input" v-model="detail.categoryId"><option value="">未分类</option><option v-for="c in categories" :value="c.id" :key="c.id">{{ c.name }}</option></select></label>
          </div>
          <div class="checks">
            <label class="check-row">状态<select class="p3r-input" v-model="detail.status"><option value="unread">待读</option><option value="reading">在读</option><option value="read">已读</option></select></label>
            <label class="check-row"><input type="checkbox" v-model="detail.starred"> 收藏</label>
          </div>
          <div class="form-actions"><button class="p3r-btn p3r-btn--primary" @click="saveDetail">保存修改</button></div>
        </div>
        <div class="p3r-sheet">
          <span class="p3r-readout">标签与合集</span>
          <div class="chips"><span v-for="t in detail.tags" class="p3r-badge">{{ t.name }} <button type="button" class="chip-x" :aria-label="'移除标签 ' + t.name" :title="'移除标签 ' + t.name" @click="removeDetailTag(t.id)">×</button></span></div>
          <div class="inline-form"><input class="p3r-input" v-model="tagSelect" list="detailTagList" placeholder="输入或选择标签，可新建" @keyup.enter="addDetailTag"><datalist id="detailTagList"><option v-for="t in availableTags" :key="t.id" :value="t.name"></option></datalist><button class="p3r-btn small" @click="addDetailTag">添加</button></div>
          <div class="chips"><span v-for="c in detail.collections" class="p3r-badge">{{ c.name }} <button type="button" class="chip-x" :aria-label="'移除合集 ' + c.name" :title="'移除合集 ' + c.name" @click="removeDetailCollection(c.id)">×</button></span></div>
          <div class="inline-form"><input class="p3r-input" v-model="collectionSelect" list="detailCollectionList" placeholder="输入或选择合集，可新建" @keyup.enter="addDetailCollection"><datalist id="detailCollectionList"><option v-for="c in availableCollections" :key="c.id" :value="c.name"></option></datalist><button class="p3r-btn small" @click="addDetailCollection">添加</button></div>
          <div class="p3r-divider"></div>
          <span class="p3r-readout">AI 摘要</span>
          <div v-if="!detail.summary" class="muted">暂无摘要，点击下方「AI 提取元数据」生成</div>
          <div v-else class="summary-wrap">
            <div ref="summaryBody" class="md-body summary-body" :class="{ collapsed: !summaryExpanded }" v-html="renderedSummary"></div>
            <button v-if="summaryOverflow || summaryExpanded" class="p3r-btn small summary-toggle" @click="summaryExpanded = !summaryExpanded">{{ summaryExpanded ? '收起' : '展开全部' }}</button>
          </div>
          <div class="form-actions" style="margin-top:16px"><button class="p3r-btn small" @click="aiExtract(detail.id)">AI 提取元数据</button><button class="p3r-btn small" @click="summarize(detail.id)">生成摘要</button></div>
        </div>
        <div class="p3r-panel pdf-panel" ref="pdfPanel">
          <span class="p3r-readout">PDF 阅读</span>
          <div class="actions"><a v-if="detail.hasPdf" class="p3r-btn small" :href="pdfUrl(detail.id)" target="_blank">打开</a><a v-if="detail.hasPdf" class="p3r-btn small" :href="pdfUrl(detail.id, true)">下载</a><button class="p3r-btn small" @click="fullWidth=!fullWidth">全宽阅读</button><button class="p3r-btn small" @click="toggleFullscreen">全屏</button></div>
          <iframe v-if="detail.hasPdf" :src="pdfUrl(detail.id)" :class="{wide: fullWidth}"></iframe>
          <div v-if="!detail.hasPdf" class="p3r-readout">该论文暂无 PDF</div>
          <div class="fs-notes" v-if="pdfFullscreen || fullWidth" ref="fsNotes" :class="{ 'fs-notes--min': fsNotesMin, 'fs-notes--pinned': fsNotesPinned, 'fs-notes--dragging': fsNotesDrag, 'fs-notes--sized': !!fsNotesSize && !fsNotesMin }" :style="fsNotesStyle">
            <div class="fs-notes__head" @pointerdown="startNotesDrag" @dblclick="resetNotesLayout" :title="fsNotesPinned ? '已固定：位置与大小已锁定，双击复位' : '按住拖动；双击复位位置与大小'">
              <span class="p3r-readout">笔记</span>
              <span class="fs-notes__status p3r-readout" v-if="notesSavedAt">已保存 {{ notesSavedAt }}</span>
              <div class="fs-notes__btns"><button class="p3r-btn small fs-notes__pin" :class="{active: fsNotesPinned}" :aria-pressed="fsNotesPinned ? 'true' : 'false'" aria-label="固定笔记框" :title="fsNotesPinned ? '取消固定（恢复拖动与调整大小）' : '固定笔记框（锁定位置与大小）'" @click="toggleNotesPin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button><button class="p3r-btn small" :class="{active: notesPreview}" :title="notesPreview ? '隐藏实时预览' : '开启实时预览（边写边渲染）'" @click="toggleNotesPreview">{{ notesPreview ? '隐藏预览' : '实时预览' }}</button><button class="p3r-btn small" @click="fsNotesMin=!fsNotesMin">{{ fsNotesMin ? '展开笔记' : '收起' }}</button><button class="p3r-btn small p3r-btn--primary" @click="saveNotes()">保存</button></div>
            </div>
            <div v-show="!fsNotesMin" class="fs-notes__date p3r-readout" v-if="detail.updatedAt">最后修改 {{ fmtDate(detail.updatedAt) }}</div>
            <div v-show="!fsNotesMin" class="notes-split" :class="{ 'notes-split--on': notesPreview }">
              <textarea class="p3r-input fs-notes__input" v-model="detail.notes" @input="autosaveNotes" rows="5" placeholder="边读边记，支持 Markdown，停止输入后自动保存..."></textarea>
              <div v-if="notesPreview" class="md-body fs-notes__preview" v-html="renderedNotes"></div>
            </div>
            <div v-if="!fsNotesMin && !fsNotesPinned" class="fs-notes__resize" title="拖动调整大小" @pointerdown="startNotesResize"></div>
          </div>
          <div class="fs-trans" v-if="pdfFullscreen || fullWidth" :class="{ 'fs-trans--min': fsTransMin }">
            <div class="fs-trans__head" @click="fsTransMin = !fsTransMin">
              <span class="p3r-readout">翻译</span>
              <span class="p3r-readout">{{ fsTransMin ? '展开 ♪' : '收起' }}</span>
            </div>
            <div v-show="!fsTransMin" class="fs-trans__body">
              <div v-if="!transHistory.length" class="muted" style="font-size:13px">粘贴一段文字点「翻译」，译文会收集在这里。</div>
              <div v-for="(h, i) in transHistory" :key="i" class="fs-trans__item">
                <div class="fs-trans__src">{{ h.src }}</div>
                <div class="md-body" v-html="h.html"></div>
              </div>
            </div>
            <div v-show="!fsTransMin" class="inline-form" style="margin:8px 0 0">
              <input class="p3r-input" v-model="instantSrc" placeholder="粘贴文本翻译..." @keyup.enter="instantTranslate">
              <button class="p3r-btn small" @click="instantTranslate" :disabled="instantLoading || !instantSrc.trim()">翻译</button>
            </div>
          </div>
        </div>
        <div class="p3r-panel grid-full">
          <div class="notes-head">
            <span class="p3r-readout">笔记</span>
            <span v-if="detail.updatedAt" class="p3r-readout notes-date">最后修改 {{ fmtDate(detail.updatedAt) }}</span>
            <button class="p3r-btn small notes-preview-btn" :class="{active: notesPreview}" :title="notesPreview ? '隐藏实时预览' : '开启实时预览（边写边渲染）'" @click="toggleNotesPreview">{{ notesPreview ? '隐藏预览' : '实时预览' }}</button>
          </div>
          <div class="notes-split" :class="{ 'notes-split--on': notesPreview }">
            <textarea class="p3r-input notes-input" v-model="detail.notes" rows="8" placeholder="支持 Markdown：# 标题、**加粗**、- 列表、`代码`、> 引用"></textarea>
            <div v-if="notesPreview" class="md-body notes-preview" v-html="renderedNotes"></div>
          </div>
          <div class="form-actions"><button class="p3r-btn p3r-btn--primary" @click="saveDetail">保存笔记</button><button class="p3r-btn small" @click="exportNotes">导出笔记</button><button class="p3r-btn small" @click="reDetect(detail.id)">重新识别元数据</button>
          <button class="p3r-btn small" @click="reExtract(detail.id)">重新提取全文</button><button class="p3r-btn small p3r-btn--danger" @click="deletePaper(detail.id)">删除论文</button></div>
        </div>
      </div>
    </template>
  </section>

  <!-- ===================== 上传 ===================== -->
  <section v-else-if="route==='upload'" class="upload-page">
    <div class="drop-zone" @dragover.prevent @drop.prevent="onDrop" @click="$refs.fileInput && $refs.fileInput.click()">
      <div class="p3r-h2">拖拽 PDF 到这里</div>
      <div class="p3r-readout">或点击选择文件 · 自动提取元数据与全文</div>
      <input type="file" ref="fileInput" accept=".pdf,application/pdf" class="hidden-input" @change="onFileChange">
    </div>
    <div v-if="uploading" class="p3r-gauge"><div class="p3r-gauge__fill" :style="{width: uploadProgress+'%'}"></div></div>
    <div v-if="uploadResult" class="p3r-sheet">
      <span class="p3r-readout">收录完成</span>
      <div class="p3r-h3">{{ uploadResult.title }}</div>
      <div class="p3r-readout">{{ uploadResult.authors }} · {{ uploadResult.year }}</div>
      <div class="actions"><button class="p3r-btn p3r-btn--primary" @click="openDetail(uploadResult.id)">查看详情</button><button class="p3r-btn" @click="resetUpload">继续上传</button></div>
    </div>
  </section>

  <!-- ===================== 图谱 ===================== -->
  <section v-else-if="route==='graph'" class="graph-page">
    <div class="p3r-panel toolbar"><span class="p3r-h3">引用图谱</span><span class="p3r-readout">{{ graphWarning || 'OpenAlex 引用网络' }}</span><button class="p3r-btn small p3r-btn--primary" @click="loadGraph(true)">重新拉取</button></div>
    <div class="p3r-panel graph-wrap"><canvas ref="graphCanvas" width="1200" height="720" @mousedown="onGraphDown" @mousemove="onGraphMove" @mouseup="onGraphUp" @mouseleave="onGraphUp" @touchstart.prevent="onGraphTouchStart" @touchmove.prevent="onGraphTouchMove" @touchend.prevent="onGraphTouchEnd"></canvas></div>
  </section>

  <!-- 添加/编辑论文弹窗（与旧逻辑一致） -->
  <div v-if="showPaperModal" class="modal-overlay" @click.self="closePaperModal">
    <div class="p3r-dialog paper-dialog">
      <div class="dialog-head"><span class="p3r-h3">{{ editingId ? '编辑论文' : '添加论文' }}</span><button class="p3r-btn" @click="closePaperModal">关闭</button></div>
      <form class="p3r-form" @submit.prevent="submitPaperForm">
        <div class="grid2"><label>标题 *<input class="p3r-input" v-model="form.title" required></label><label>作者<input class="p3r-input" v-model="form.authors" placeholder="逗号分隔"></label></div>
        <div class="grid2"><label>年份<input class="p3r-input" v-model="form.year" type="number"></label><label>期刊/会议<input class="p3r-input" v-model="form.venue"></label></div>
        <div class="grid2"><label>DOI<input class="p3r-input" v-model="form.doi"></label><label>关键词<input class="p3r-input" v-model="form.keywords"></label></div>
        <div class="grid2"><label>分类<select class="p3r-input" v-model="form.categoryId"><option value="">未分类</option><option v-for="c in categories" :value="c.id" :key="c.id">{{ c.name }}</option></select></label><label>链接<input class="p3r-input" v-model="form.link"></label></div>
        <div class="grid2"><label>标签<input class="p3r-input" v-model="form.tags" placeholder="逗号分隔"></label><label>合集<input class="p3r-input" v-model="form.collections" placeholder="逗号分隔"></label></div>
        <div class="grid2"><label>PDF 文件<input class="p3r-input" type="file" ref="pdfInput" accept=".pdf,application/pdf" @change="onPdfChange"></label><div class="ai-check"><label class="check-row"><input type="checkbox" v-model="form.useAI"> 使用 AI 补充提取</label><span class="p3r-readout">{{ hasApiKey ? '已配置 Key' : '未配置 Key，将跳过 AI' }}</span></div></div>
        <label>一句话总结<textarea class="p3r-input" v-model="form.summary" rows="2"></textarea></label>
        <label>笔记<textarea class="p3r-input" v-model="form.notes" rows="4"></textarea></label>
        <div class="checks"><label class="check-row"><input type="checkbox" v-model="form.read"> 已读</label><label class="check-row"><input type="checkbox" v-model="form.starred"> 收藏</label></div>
        <div class="form-actions"><button type="button" class="p3r-btn" @click="closePaperModal">取消</button><button type="submit" class="p3r-btn p3r-btn--primary" :disabled="saving">保存</button></div>
      </form>
    </div>
  </div>

  <!-- 管理弹窗 -->
  <div v-if="showManage" class="modal-overlay" @click.self="showManage=false">
    <div class="p3r-dialog wide">
      <div class="dialog-head"><span class="p3r-h3">管理</span><div class="actions"><button class="p3r-btn small" @click="openTrash" title="查看已删除的论文，可恢复或彻底删除">回收站<span v-if="trashCount"> ({{ trashCount }})</span></button><button class="p3r-btn small" @click="exportBackup" title="导出数据库快照与全部 PDF，解压覆盖 data/ 即可恢复">导出备份</button><button class="p3r-btn small" @click="exportAllNotes">导出全部笔记</button><button class="p3r-btn" @click="showManage=false">关闭</button></div></div>
      <div class="manage-grid">
        <div class="p3r-panel"><span class="p3r-h3">分类</span><div class="inline-form"><input class="p3r-input" v-model="newCategory" placeholder="新分类"><button class="p3r-btn small p3r-btn--primary" @click="addCategory">添加</button></div><ul class="manage-list"><li v-for="c in categories" :key="c.id"><span>{{ c.name }} ({{ c.paperCount }})</span><button class="p3r-btn small p3r-btn--danger" @click="deleteCategory(c.id)">删除</button></li></ul></div>
        <div class="p3r-panel"><span class="p3r-h3">标签</span><div class="inline-form"><input class="p3r-input" v-model="newTag" placeholder="新标签"><button class="p3r-btn small p3r-btn--primary" @click="addTag">添加</button></div><ul class="manage-list"><li v-for="t in tags" :key="t.id"><span>{{ t.name }} ({{ t.paperCount }})</span><button class="p3r-btn small p3r-btn--danger" @click="deleteTag(t.id)">删除</button></li></ul></div>
        <div class="p3r-panel"><span class="p3r-h3">合集</span><div class="inline-form"><input class="p3r-input" v-model="newCollection" placeholder="新合集"><button class="p3r-btn small p3r-btn--primary" @click="addCollection">添加</button></div><ul class="manage-list"><li v-for="o in collections" :key="o.id"><span>{{ o.name }} ({{ o.paperCount }})</span><button class="p3r-btn small p3r-btn--danger" @click="deleteCollection(o.id)">删除</button></li></ul></div>
      </div>
    </div>
  </div>

  <!-- 回收站弹窗 -->
  <div v-if="showTrash" class="modal-overlay" @click.self="showTrash=false">
    <div class="p3r-dialog wide">
      <div class="dialog-head"><span class="p3r-h3">回收站</span><div class="actions"><span class="p3r-readout" v-if="trash.length">共 {{ trash.length }} 篇</span><button class="p3r-btn small p3r-btn--danger" v-if="trash.length" @click="emptyTrash">清空回收站</button><button class="p3r-btn" @click="showTrash=false">关闭</button></div></div>
      <div v-if="trashLoading" class="p3r-readout">加载中…</div>
      <div v-else-if="!trash.length" class="p3r-readout">回收站是空的。删除的论文会先放在这里，可随时恢复。</div>
      <ul class="manage-list trash-list" v-else>
        <li v-for="p in trash" :key="p.id">
          <span class="trash-title">{{ p.title }}<span class="p3r-readout"> · 删除于 {{ fmtDate(p.deletedAt) }}</span></span>
          <span class="actions"><button class="p3r-btn small" @click="restorePaper(p.id)">恢复</button><button class="p3r-btn small p3r-btn--danger" @click="purgePaper(p)">彻底删除</button></span>
        </li>
      </ul>
    </div>
  </div>

  <!-- AI 设置弹窗 -->
  <div v-if="showSettings" class="modal-overlay" @click.self="showSettings=false">
    <div class="p3r-dialog">
      <div class="dialog-head"><span class="p3r-h3">AI 设置</span><button class="p3r-btn" @click="showSettings=false">关闭</button></div>
      <div class="p3r-form">
        <div class="p3r-panel summary-panel"><span class="p3r-readout">状态</span><div class="p3r-h3" :class="hasApiKey ? 'p3r-accent' : ''">{{ hasApiKey ? '已配置 API Key' : '未配置 API Key，AI 功能将跳过' }}</div><div class="actions"><button class="p3r-btn small" @click="testAI" :disabled="testingAI">{{ testingAI ? '测试中...' : '测试连接' }}</button><span class="p3r-readout" v-if="aiTestResult">{{ aiTestResult }}</span></div></div>
        <label>接口地址<input class="p3r-input" v-model="settings.aiBaseUrl" placeholder="https://tokendance.space/gateway/v1 或 https://api.deepseek.com/v1"><span class="p3r-readout">OpenAI 兼容网关地址，修改后点「刷新模型列表」</span></label>
        <label>模型
          <select v-if="!customModel" class="p3r-input" v-model="settings.aiModel" @change="onModelChange" :disabled="aiModelsLoading">
            <option v-if="aiModelsLoading && !aiModels.length" value="" disabled>加载中...</option>
            <option v-for="m in aiModels" :key="m.id" :value="m.id">{{ m.name && m.name !== m.id ? m.id + '（' + m.name + '）' : m.id }}</option>
            <option value="__custom__">手动输入…</option>
          </select>
          <input v-else class="p3r-input" v-model="settings.aiModel" placeholder="输入模型名，如 deepseek-chat / gpt-4o-mini">
          <span class="p3r-readout">模型来自接口地址的 /models，打开设置时自动拉取；<a class="chip-x" @click.prevent="customModel = !customModel">{{ customModel ? '改回列表选择' : '没有想要的模型？手动输入' }}</a></span>
        </label>
        <div class="actions"><button class="p3r-btn small" @click="refreshAIModels" :disabled="aiModelsLoading">{{ aiModelsLoading ? '加载中...' : '刷新模型列表' }}</button><span class="p3r-readout" v-if="!aiModelsLoading && aiModels.length">共 {{ aiModels.length }} 个模型</span></div>
        <label>API Key<input class="p3r-input" v-model="settings.aiApiKey" type="password" placeholder="sk-...（留空保持不变）"></label>
        <div class="form-actions"><button class="p3r-btn p3r-btn--danger" @click="clearApiKey">清除 API Key</button><button class="p3r-btn p3r-btn--primary" @click="saveSettings">保存设置</button></div>
      </div>
    </div>
  </div>

  <div v-if="toast.show" class="toast" :class="{error: toast.error}">{{ toast.msg }}</div>

  <!-- 悬浮球：问论文库 / 主题 -->
  <div v-if="askOpen && !uiBlocked" class="ask-float">
    <div class="ask-float__head"><span class="p3r-readout">问论文库 · RAG</span><button type="button" class="chip-x" aria-label="关闭" title="关闭" @click="askOpen=false">×</button></div>
    <div class="ask-float__body">
      <div v-if="asking" class="p3r-readout">思考中...</div>
      <div v-else-if="!answer" class="muted">用中文向整个论文库提问，回答附带来源片段。</div>
      <div v-else class="ask-answer md-body" v-html="renderedAnswer"></div>
      <details v-for="s in sources" :key="s.id" class="ask-source"><summary>[{{ s.id }}] {{ s.title }}</summary><div class="p3r-readout">{{ s.excerpt }}</div></details>
    </div>
    <div class="inline-form" style="margin:8px 0 0">
      <input class="p3r-input" v-model="question" placeholder="用中文提问你的论文库..." @keyup.enter="ask">
      <button class="p3r-btn small p3r-btn--primary" @click="ask" :disabled="asking">提问</button>
    </div>
  </div>

  <div v-if="themeOpen && !uiBlocked" class="fab-pop">
    <button v-for="t in themeOptions" :key="t.v" class="fab-pop__item" :class="{cur: theme===t.v}" @click="pickTheme(t.v)">
      <span>{{ t.t }}</span><span v-if="theme===t.v" class="p3r-readout">✓</span>
    </button>
  </div>

  <div class="fabs" v-if="!uiBlocked">
    <div class="fab" :class="{active: askOpen}" @click="askOpen=!askOpen; themeOpen=false" title="问论文库">{{ askOpen ? '×' : '问' }}</div>
    <div class="fab" :class="{active: themeOpen}" @click="themeOpen=!themeOpen; askOpen=false" title="主题">◐</div>
  </div>
</div>
</script>

<script src="assets/vue.global.prod.js"></script>
<script src="assets/md-mini.js"></script>
<script src="app.js"></script>
</body>
</html>
