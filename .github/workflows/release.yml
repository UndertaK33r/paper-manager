name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 构建
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64; do
            os=${t%/*}; arch=${t#*/}
            out="dist/paper-manager-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/server
          done
      - name: 打包
        run: |
          cp 使用说明.txt dist/
          cd dist
          for f in paper-manager-*; do
            zip -q "${f}.zip" "$f" 使用说明.txt
          done
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
